name: Build Shimboot ChromeOS

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Board name'
        default: 'octopus'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl cgpt kpartx dosfstools \
          squashfs-tools unzip cryptsetup lvm2 fdisk gdisk util-linux \
          binwalk pcregrep cpio lz4 pv debootstrap python3

      - name: Download shim
        run: |
          mkdir -p data
          BOARDS_INDEX=$(curl -s "https://cdn.cros.download/boards.txt")
          SHIM_MANIFEST_PATH=$(echo "$BOARDS_INDEX" | grep "/octopus/" | head -1).manifest
          SHIM_MANIFEST=$(curl -s "https://cdn.cros.download/$SHIM_MANIFEST_PATH")
          SHIM_DIR=$(dirname "$SHIM_MANIFEST_PATH")
          CHUNKS=$(echo "$SHIM_MANIFEST" | python3 -c "
          import json, sys
          m = json.load(sys.stdin)
          print('\n'.join(m['chunks']))
          ")
          mkdir -p data/shim_chunks
          for CHUNK in $CHUNKS; do
            wget -q "https://cdn.cros.download/$SHIM_DIR/$CHUNK" -O "data/shim_chunks/$CHUNK"
          done
          cat data/shim_chunks/* > data/shim_octopus.zip
          unzip -p data/shim_octopus.zip > data/shim_octopus.bin
          rm -rf data/shim_chunks data/shim_octopus.zip
          echo "Shim done: $(du -h data/shim_octopus.bin)"

      - name: Download R107 recovery
        run: |
          wget -q --show-progress \
            "https://dl.google.com/dl/edgedl/chromeos/recovery/chromeos_15117.86.0_octopus_recovery_stable-channel_mp-v31.bin.zip" \
            -O data/reco_octopus.zip
          unzip -p data/reco_octopus.zip > data/reco_octopus.bin
          rm data/reco_octopus.zip
          echo "Recovery done: $(du -h data/reco_octopus.bin)"

      - name: Build Debian rootfs
        run: |
          sudo ./build_rootfs.sh data/rootfs_debian bookworm \
            hostname=shimboot-octopus \
            username=user \
            user_passwd=user \
            arch=amd64 \
            distro=debian \
            quiet=true

      - name: Patch Debian rootfs
        run: |
          sudo ./patch_rootfs.sh data/shim_octopus.bin data/reco_octopus.bin \
            data/rootfs_debian quiet=true

      - name: Extract ChromeOS rootfs from recovery
        run: |
          set -e
          RECO_BIN="data/reco_octopus.bin"
          RECO_LOOP=$(sudo losetup -f --show -P "$RECO_BIN")
          sudo mkdir -p /mnt/chromeos_src
          sudo mount -o ro ${RECO_LOOP}p3 /mnt/chromeos_src
          mkdir -p data/rootfs_chromeos
          sudo cp -a /mnt/chromeos_src/. data/rootfs_chromeos/
          sudo umount /mnt/chromeos_src
          sudo losetup -d $RECO_LOOP
          echo "ChromeOS rootfs done: $(du -sh data/rootfs_chromeos)"

      - name: Build base image with Debian only
        run: |
          sudo ./build.sh data/shimboot_octopus.bin \
            data/shim_octopus.bin \
            data/rootfs_debian \
            name=debian \
            quiet=true
          echo "Base image partition table:"
          sudo cgpt show data/shimboot_octopus.bin

      - name: Append ChromeOS and exam partitions manually
        run: |
          set -e

          IMAGE="data/shimboot_octopus.bin"

          append_rootfs() {
            local rootfs_dir="$1"
            local part_name="$2"

            echo "=== Appending partition: $part_name ==="

            # Size of rootfs in sectors (512 bytes each), add 20% headroom
            local rootfs_bytes=$(sudo du -sb "$rootfs_dir" | cut -f1)
            local part_sectors=$(( (rootfs_bytes * 12 / 10 / 512) + 4096 ))
            # Round up to nearest 2048 (1MB alignment)
            part_sectors=$(( (part_sectors / 2048 + 1) * 2048 ))

            # Find where current disk ends (last sector of last partition)
            local last_end=$(sudo sgdisk -p "$IMAGE" | grep "^ " | awk '{print $3}' | sort -n | tail -1)
            local new_start=$(( last_end + 1 ))
            # Align start to 2048
            new_start=$(( (new_start / 2048 + 1) * 2048 ))
            local new_end=$(( new_start + part_sectors - 1 ))

            # New total disk size in bytes (new_end + GPT backup + buffer)
            local new_disk_sectors=$(( new_end + 2048 ))
            local new_disk_bytes=$(( new_disk_sectors * 512 ))

            echo "Extending image to ${new_disk_bytes} bytes"
            sudo truncate -s "$new_disk_bytes" "$IMAGE"

            # Move GPT backup header to end of newly extended disk
            sudo sgdisk -e "$IMAGE"

            echo "Adding partition $part_name: sectors $new_start to $new_end"
            sudo sgdisk "$IMAGE" \
              --new=0:${new_start}:${new_end} \
              --change-name=0:"shimboot_rootfs:${part_name}" \
              --typecode=0:0FC63DAF-8483-4772-8E79-3D69D8477DE4

            # Get the new partition number
            local part_num=$(sudo sgdisk -p "$IMAGE" | grep "shimboot_rootfs:${part_name}" | awk '{print $1}')
            echo "New partition number: $part_num"

            # Format and populate
            local loop=$(sudo losetup -f --show -P "$IMAGE")
            echo "Loop: $loop, partition: ${loop}p${part_num}"
            sleep 1

            sudo mkfs.ext4 "${loop}p${part_num}"

            local mnt="/tmp/new_part_mnt"
            sudo mkdir -p "$mnt"
            sudo mount "${loop}p${part_num}" "$mnt"
            echo "Copying rootfs..."
            sudo cp -a "$rootfs_dir"/. "$mnt"/
            sudo umount "$mnt"
            sudo losetup -d "$loop"
            echo "Done: $part_name"
          }

          append_rootfs data/rootfs_chromeos "chromeos"
          sudo cp -a data/rootfs_chromeos data/rootfs_chromeos_exam
          append_rootfs data/rootfs_chromeos_exam "chromeos_exam"

          echo "=== Final partition table ==="
          sudo sgdisk -p "$IMAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shimboot-octopus
          path: data/shimboot_octopus.bin
          retention-days: 5
